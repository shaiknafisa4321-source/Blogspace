{% extends "base.html" %}
{% block content %}
<div class="form-box">
<h1>Edit Blog</h1>
<form method="POST">
    <input type="text"
           name="title"
           value="{{ blog.title }}"
           required>
    <textarea name="content"
              required>{{ blog.content }}</textarea>
    <button type="submit">Update Blog</button>
</form>
</div>
{% endblock %}
