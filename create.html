{% extends "base.html" %}
{% block content %}
<div class="form-box">
<h1>Create Your Blog</h1>
<form method="POST">
    <input type="text"
           name="title"
           placeholder="Blog Title"
           required>
    <textarea name="content"
              placeholder="Write your blog here..."
              required></textarea>
    <button type="submit">Publish Blog</button>
</form>
</div>
{% endblock %}
